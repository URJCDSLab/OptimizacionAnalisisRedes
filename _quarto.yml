format:
  html:
    theme: cerulean
    lang: es
    css: estilos_html.css
    lightbox: true
    include-after-body:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", function () {
          // Categorize callouts: Quarto puts the title in the `title` attribute of the .callout div
          document.querySelectorAll(".callout[title]").forEach(function (callout) {
            var text = callout.getAttribute("title").trim().toLowerCase();

            // Si ya es warning o caution, siempre es advertencia (sin importar el título)
            if (callout.classList.contains("callout-warning") || callout.classList.contains("callout-caution")) {
              callout.setAttribute("data-kind", "advertencia");
            } else if (text.includes("objetivo") && (text.includes("aprendizaje") || text.startsWith("objetivo"))) {
              callout.setAttribute("data-kind", "objetivos");
            } else if (/^\s*(teorema|demostración|demostracion)\b/.test(text)) {
              callout.setAttribute("data-kind", "teorema");
            } else if (/^\s*lema\b/.test(text)) {
              callout.setAttribute("data-kind", "lema");
            } else if (/^\s*corolario\b/.test(text)) {
              callout.setAttribute("data-kind", "corolario");
            } else if (/^\s*(definición|definicion)\b/.test(text)) {
              callout.setAttribute("data-kind", "definicion");
            } else if (/^\s*(ejemplo|ejemplos)\b/.test(text)) {
              callout.setAttribute("data-kind", "ejemplo");
            } else if (/^\s*(esquema|propiedades)\b/.test(text)) {
              callout.setAttribute("data-kind", "esquema");
            } else if (/^\s*(advertencia|precaución|precaucion|importancia|limitación|limitacion)\b/.test(text) || text.includes("recíproco") || text.includes("no es cierto")) {
              callout.setAttribute("data-kind", "advertencia");
            } else if (/^\s*(nota|observación|observacion)\b/.test(text)) {
              callout.setAttribute("data-kind", "nota");
            }
          });

          var toc = document.getElementById("TOC");
          if (!toc) return;

          var links = Array.from(toc.querySelectorAll("a.nav-link"));
          if (links.length === 0) return;

          function getTargets() {
            return links.map(function (link) {
              var targetId = link.getAttribute("data-scroll-target") || link.getAttribute("href");
              if (targetId && targetId.startsWith("#")) {
                return document.getElementById(decodeURIComponent(targetId.substring(1)));
              }
              return null;
            });
          }

          var targets = getTargets();

          function updateTOC() {
            var scrollPos = window.scrollY || document.documentElement.scrollTop || 0;
            var windowHeight = window.innerHeight;
            var docHeight = document.documentElement.scrollHeight;

            var activeIdx = -1;

            if (scrollPos + windowHeight >= docHeight - 20) {
              activeIdx = targets.length - 1;
            } else {
              for (var i = targets.length - 1; i >= 0; i--) {
                if (targets[i]) {
                  var top = targets[i].getBoundingClientRect().top + scrollPos;
                  if (scrollPos >= top - 140) {
                    activeIdx = i;
                    break;
                  }
                }
              }
            }

            if (activeIdx < 0) activeIdx = 0;

            links.forEach(function (link, idx) {
              if (idx === activeIdx) {
                link.classList.add("active");
                link.style.color = "#0284c7";
                link.style.fontWeight = "bold";
              } else {
                link.classList.remove("active");
                link.style.color = "";
                link.style.fontWeight = "";
              }
            });

            // Handle accordion collapse/expand
            var collapses = toc.querySelectorAll("ul.collapse");
            collapses.forEach(function (c) {
              c.classList.remove("show");
              c.style.display = "none";
            });

            var activeLink = links[activeIdx];
            if (activeLink) {
              // Show parent collapse if inside a subsection
              var parentUl = activeLink.closest("ul.collapse");
              if (parentUl) {
                parentUl.classList.add("show");
                parentUl.style.display = "block";
              }
              // Show child collapse if active link is a main section with sub-items
              var parentLi = activeLink.closest("li");
              if (parentLi) {
                var childUl = parentLi.querySelector("ul.collapse");
                if (childUl) {
                  childUl.classList.add("show");
                  childUl.style.display = "block";
                }
              }
            }
          }

          window.addEventListener("scroll", updateTOC);
          window.addEventListener("resize", updateTOC);
          setTimeout(updateTOC, 100);
        });
        </script>


  pdf:
    documentclass: scrreprt
    title-block-banner: false 
    toc: true
    toc-depth: 3
    toc-title: "Índice apuntes"
    number-sections: true
