<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { margin:0; padding:0; overflow:hidden; background:#fff;
    display:flex; justify-content:center; align-items:center;
    height:100vh; width:100vw;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .player-wrap { display:flex; flex-direction:column; align-items:center; width:98vw; max-height:98vh; }
  .player-wrap img { max-width:100%; max-height:82vh; height:auto; display:block; }
  .controls { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .controls button {
    background:#f1f5f9; border:1px solid #e2e8f0; border-radius:50%;
    width:38px; height:38px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    color:#475569; transition:all 0.2s ease;
    outline:none; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
  .controls button:hover { background:#e2e8f0; color:#0f172a; }
  .controls button.active { background:#0284c7; color:#fff; border-color:#0284c7; }
  input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:260px; height:5px; background:#e2e8f0;
    border-radius:3px; outline:none; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px;
    border-radius:50%; background:#0284c7; cursor:pointer;
    transition:transform 0.1s ease; }
  input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.2); background:#0369a1; }
  .frame-label { font-size:12px; color:#64748b; min-width:60px; text-align:center; }
</style>

  var idx = 0;
  var timer = null;
  var img = document.getElementById('pf');
  var slider = document.getElementById('slider');
  var lbl = document.getElementById('lbl');
  var btnPlay = document.getElementById('btn-play');
  var btnPrev = document.getElementById('btn-prev');
  var btnNext = document.getElementById('btn-next');

  function update() {
    img.src = frames[idx];
    slider.value = idx;
    lbl.textContent = (idx + 1) + " / " + frames.length;
  }

  function play() {
    if (timer) return;
    btnPlay.classList.add('active');
    btnPlay.innerHTML = '<i class="fa fa-pause"></i>';
    timer = setInterval(function() {
      idx = (idx + 1) % frames.length;
      update();
    }, 1800);
  }

  function pause() {
    if (!timer) return;
    clearInterval(timer);
    timer = null;
    btnPlay.classList.remove('active');
    btnPlay.innerHTML = '<i class="fa fa-play"></i>';
  }

  btnPlay.addEventListener('click', function() {
    if (timer) pause(); else play();
  });

  btnPrev.addEventListener('click', function() {
    pause();
    idx = (idx - 1 + frames.length) % frames.length;
    update();
  });

  btnNext.addEventListener('click', function() {
    pause();
    idx = (idx + 1) % frames.length;
    update();
  });

  slider.addEventListener('input', function() {
    pause();
    idx = parseInt(slider.value, 10);
    update();
  });

  update();
</script>
