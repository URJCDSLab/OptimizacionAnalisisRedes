    width:260px; height:5px; background:#e2e8f0;
    border-radius:3px; outline:none; }

    -webkit-appearance:none; width:14px; height:14px;
    border-radius:50%; background:#0284c7; cursor:pointer;
    transition:transform 0.1s ease; }
  input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.2); background:#0369a1; }

  var idx = 0;
  var timer = null;
  var img = document.getElementById('pf');
  var slider = document.getElementById('slider');
  var lbl = document.getElementById('lbl');
  var btnPlay = document.getElementById('btn-play');
  var btnPrev = document.getElementById('btn-prev');
  var btnNext = document.getElementById('btn-next');

  function update() {
    img.src = frames[idx];
    slider.value = idx;
    lbl.textContent = (idx + 1) + " / " + frames.length;
  }

  function play() {
    if (timer) return;
    btnPlay.classList.add('active');
    btnPlay.innerHTML = '<i class="fa fa-pause"></i>';
    timer = setInterval(function() {
      idx = (idx + 1) % frames.length;
      update();
    }, 1800);
  }

  function pause() {
    if (!timer) return;
    clearInterval(timer);
    timer = null;
    btnPlay.classList.remove('active');
    btnPlay.innerHTML = '<i class="fa fa-play"></i>';
  }

  btnPlay.addEventListener('click', function() {
    if (timer) pause(); else play();
  });

  btnPrev.addEventListener('click', function() {
    pause();
    idx = (idx - 1 + frames.length) % frames.length;
    update();
  });

  btnNext.addEventListener('click', function() {
    pause();
    idx = (idx + 1) % frames.length;
    update();
  });

  slider.addEventListener('input', function() {
    pause();
    idx = parseInt(slider.value, 10);
    update();
  });

  update();
</script>
