<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { margin:0; padding:0; overflow:hidden; background:#fff;
    display:flex; justify-content:center; align-items:center;
    height:100vh; width:100vw;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
  .player-wrap { display:flex; flex-direction:column; align-items:center; width:98vw; max-height:98vh; }
  .player-wrap img { max-width:100%; max-height:82vh; height:auto; display:block; }
  .controls { display:flex; align-items:center; gap:10px; margin-top:10px; }
  .controls button {
    background:#f1f5f9; border:1px solid #e2e8f0; border-radius:50%;
    width:38px; height:38px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center;
    color:#475569; transition:all 0.2s ease;
    outline:none; box-shadow:0 1px 2px rgba(0,0,0,0.05); }
  .controls button:hover { background:#e2e8f0; color:#0f172a; }
  .controls button.active { background:#0284c7; color:#fff; border-color:#0284c7; }
  input[type=range] {
    -webkit-appearance:none; appearance:none;
    width:260px; height:5px; background:#e2e8f0;
    border-radius:3px; outline:none; }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px;
    border-radius:50%; background:#0284c7; cursor:pointer;
    transition:transform 0.1s ease; }
  input[type=range]::-webkit-slider-thumb:hover { transform:scale(1.2); background:#0369a1; }
  .frame-label { font-size:12px; color:#64748b; min-width:60px; text-align:center; }
</style>
</head>

  var n = frames.length;
  var cur = 0, playing = false, timer = null, dur = 2000;
  var img = document.getElementById('pf');
  var sl = document.getElementById('slider');
  var lbl = document.getElementById('lbl');
  var btnPlay = document.getElementById('btn-play');
  sl.max = n - 1;
  function show(i) { cur = ((i % n) + n) % n; img.src = frames[cur]; sl.value = cur; lbl.textContent = (cur+1)+' / '+n; }
  function togglePlay() {
    playing = !playing;
    btnPlay.innerHTML = playing ? '<i class="fa fa-pause"></i>' : '<i class="fa fa-play"></i>';
    if (playing) { timer = setInterval(function(){ show(cur+1); }, dur); }
    else { clearInterval(timer); }
  }
  document.getElementById('btn-play').onclick = togglePlay;
  document.getElementById('btn-prev').onclick = function(){ if(playing) togglePlay(); show(cur-1); };
  document.getElementById('btn-next').onclick = function(){ if(playing) togglePlay(); show(cur+1); };
  sl.oninput = function(){ if(playing) togglePlay(); show(parseInt(this.value)); };
  show(0);
  togglePlay();
</script>
